name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: ctions/checkout@v4
        with:
          clean: true

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | \
          docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ secrets.DOCKER_USERNAME }}/cicd-demo:latest" .

      - name: Push Docker image
        run: |
          docker push \
            "${{ secrets.DOCKER_USERNAME }}/cicd-demo:latest"
      - name: Clean worksoace
        run: |
          rm -rf ./*
          rm -rf ./.git
